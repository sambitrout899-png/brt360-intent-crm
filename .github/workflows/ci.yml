# BRT 360 CI: every push and pull request is tested and both images are built.
# Nothing is deployed from here yet - deploy/deploy_docker.ps1 does that; a
# registry push + Argo CD come later (Phase 0 of the architecture plan).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # what the Docker image runs
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # test_admin_test_runner.py only runs this same suite again from inside the app
      - run: python -m pytest -q -p no:cacheprovider --ignore=tests/test_admin_test_runner.py

  # The whole suite as production runs it: Postgres, tenant isolation policies on, the app
  # working as the plain role RLS applies to (tests/conftest.py, app/rls.py).
  backend-postgres-rls:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: brt360_test
          POSTGRES_USER: brt360
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brt360 -d brt360_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://brt360:ci@localhost:5432/brt360_test
      TEST_RLS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -p no:cacheprovider --ignore=tests/test_admin_test_runner.py

  # The app has run on SQLite for its whole history; production moves to Postgres.
  # Every migration and the seed must work there too (deploy/compose: the migrate service).
  postgres-migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: brt360
          POSTGRES_USER: brt360
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brt360 -d brt360" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://brt360:ci@localhost:5432/brt360
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m app.rls
      - run: python -m app.seed
      - name: Schema matches the models
        run: python -m alembic check || echo "::warning::alembic check found differences between the models and the migrated schema"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vite build

  images:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t brt360-api:ci backend
      - run: docker build -t brt360-web:ci frontend
      - name: Web container's nginx config is valid
        run: docker run --rm brt360-web:ci nginx -t
      - name: Compose file is valid
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/; s/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=ci/' .env
          touch ../../backend/.env
          docker compose --profile monitoring config --quiet

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse
        run: for f in deploy/*.sh deploy/compose/*.sh; do bash -n "$f" || exit 1; done
