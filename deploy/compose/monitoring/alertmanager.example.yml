# Copy to monitoring/alertmanager.yml on the server and fill in the SMTP account the
# alert emails are sent from (it holds a password: chmod 600, never in git).
#   cp monitoring/alertmanager.example.yml monitoring/alertmanager.yml && chmod 600 monitoring/alertmanager.yml
# Gmail: smtp.gmail.com:587 with an app password (Google account -> Security -> App passwords).
global:
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "BRT 360 alerts <you@example.com>"
  smtp_auth_username: "you@example.com"
  smtp_auth_password: "app-password-here"
  smtp_require_tls: true

route:
  receiver: email
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h   # a problem that lasts is emailed again every 4 hours

receivers:
  - name: email
    email_configs:
      - to: "you@example.com"
        send_resolved: true   # and once more when it's fixed
