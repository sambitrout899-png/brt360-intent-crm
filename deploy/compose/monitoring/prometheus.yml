# Prometheus for BRT 360 (docker compose --profile monitoring).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # every API worker's request counts and latency, added up (app/observability.py)
  - job_name: brt360-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
