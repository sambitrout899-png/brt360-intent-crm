# BRT 360 on one server - the "compact" profile of the target architecture.
#
#   cd /opt/brt360/deploy/compose
#   docker compose up -d --build                         the app
#   docker compose --profile monitoring up -d            + Prometheus, Grafana, alerts
#   (README.md here has the first-time steps)
#
# Staging is a second copy of all of this in /opt/brt360-staging (setup_staging.sh):
# its own code, database, secrets and port; its deploy/compose/.env sets
# COMPOSE_PROJECT_NAME and IMAGE_PREFIX so nothing is shared with production.
#
# The host nginx stays the front door (it also serves the server's other
# sites): it passes BRT 360's traffic to the web container on 127.0.0.1:$WEB_PORT.
# Nothing else is published to the outside; Grafana listens on 127.0.0.1 only
# (reach it through an SSH tunnel).
#
# Limits are sized for the 4-vCPU / 16 GB server, shared with other projects
# and the host's Ollama.

name: brt360

# what every app container (migrate, api, worker, training) is told on top of backend/.env
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://brt360:${POSTGRES_PASSWORD}@postgres:5432/brt360
  # the app works as this plain role, which row-level security applies to (app/rls.py);
  # migrations and scripts keep the owner
  DATABASE_APP_ROLE: brt360_app
  REDIS_URL: redis://redis:6379/0
  JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private.pem
  # the host's Ollama (deploy/local_llm.sh) - see README.md, "Local LLM"
  LOCAL_LLM_BASE_URL: http://host.docker.internal:11434/v1
  # training runs in its own container; the API leaves its routes to it
  SPLIT_SERVICES: training
  # every model call goes through the AI gateway, the only container with the model key
  AI_GATEWAY_URL: http://ai-gateway:8000
  AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:?set AI_GATEWAY_TOKEN in deploy/compose/.env - apply.sh creates it}
  OPENAI_API_KEY: ""

x-app: &app
  # IMAGE_PREFIX keeps staging's images apart from production's (both are built on this server)
  image: ${IMAGE_PREFIX:-brt360}-api:${BRT_VERSION:-local}
  build: ../../backend
  restart: unless-stopped
  # the app's own settings and secrets (BRT_ID, OpenAI, SMTP...) - the same file the
  # systemd install uses; `environment` overrides what differs in containers
  env_file: ../../backend/.env
  environment: *app-env
  volumes:
    # the token signing key apply_sto.sh created (owned by uid 10001, the image's user)
    - ../../backend/jwt_private.pem:/run/secrets/jwt_private.pem:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: brt360
      POSTGRES_USER: brt360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brt360 -d brt360"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1536M}

  # nightly database dump at 02:00 UTC into ./backups, newest 14 days kept (backup.sh)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/scripts/backup.sh:ro
    entrypoint: ["sh", "-c", "echo '0 2 * * * sh /scripts/backup.sh >> /proc/1/fd/1 2>&1' | crontab - && exec crond -f -l 8"]
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  # shared rate-limit counters for every API worker (nothing durable lives here)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M}

  # one-shot before the API starts: schema up to date, tenant isolation policies on
  # every tenant table (app/rls.py - new tables included), reference data
  migrate:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m app.rls && python -m app.seed"]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *app
    environment:
      <<: *app-env
      WEB_CONCURRENCY: ${API_WORKERS:-3}
      SCHEDULER_MODE: "off"   # the worker container runs the background jobs
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}

  # background jobs (inventory sync, reservation expiry) - exactly one copy; split services'
  # jobs run in their own workers (training-worker)
  worker:
    <<: *app
    command: ["python", "-m", "app.scheduler"]
    healthcheck: {disable: true}
    depends_on:
      migrate: {condition: service_completed_successfully}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

  # the training workspace and participant pages (backend/app/services/training.py): the web
  # container sends /api/training, /api/assessments and /api/p here
  # Its own image name (same Dockerfile): `deploy_docker.ps1 -Service training` rebuilds and
  # replaces training and training-worker only - the API keeps running its own image.
  training:
    <<: *app
    image: ${IMAGE_PREFIX:-brt360}-training:${BRT_VERSION:-local}
    command: ["gunicorn", "app.services.training_app:app", "-k", "uvicorn.workers.UvicornWorker", "-b", "0.0.0.0:8000",
              "--timeout", "120", "--access-logfile", "-", "--forwarded-allow-ips", "*"]
    environment:
      <<: *app-env
      WEB_CONCURRENCY: ${TRAINING_WORKERS:-2}
      SCHEDULER_MODE: "off"   # training's jobs run in training-worker
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 768M}

  # training's background jobs (reminders, retention) - the worker container leaves them out
  training-worker:
    <<: *app
    image: ${IMAGE_PREFIX:-brt360}-training:${BRT_VERSION:-local}
    command: ["python", "-m", "app.scheduler", "--service", "training"]
    healthcheck: {disable: true}
    depends_on:
      migrate: {condition: service_completed_successfully}
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 256M}

  # the one way out to a language model (backend/app/services/ai_gateway.py): it alone gets
  # OPENAI_API_KEY (from backend/.env); the app containers have it blanked above
  ai-gateway:
    <<: *app
    image: ${IMAGE_PREFIX:-brt360}-ai-gateway:${BRT_VERSION:-local}
    command: ["gunicorn", "app.services.ai_gateway:app", "-k", "uvicorn.workers.UvicornWorker", "-b", "0.0.0.0:8000",
              "--timeout", "130", "--access-logfile", "-"]
    environment:
      DATABASE_URL: postgresql+psycopg://brt360:${POSTGRES_PASSWORD}@postgres:5432/brt360
      DATABASE_APP_ROLE: brt360_app   # reads a tenant's own key from ai_settings, under row-level security
      REDIS_URL: redis://redis:6379/0  # per-tenant call limits shared by its workers
      LOCAL_LLM_BASE_URL: http://host.docker.internal:11434/v1
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN}
      AI_GATEWAY_TENANT_RPM: ${AI_GATEWAY_TENANT_RPM:-60}
      AI_GATEWAY_TENANT_MONTHLY_TOKENS: ${AI_GATEWAY_TENANT_MONTHLY_TOKENS:-0}
      AI_GATEWAY_REDACT: ${AI_GATEWAY_REDACT:-true}
      WEB_CONCURRENCY: 2
      SCHEDULER_MODE: "off"
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 384M}

  web:
    image: ${IMAGE_PREFIX:-brt360}-web:${BRT_VERSION:-local}
    build: ../../frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    # not on training: nginx looks it up per request, so a broken training container
    # fails only the training pages, never the whole site
    depends_on:
      api: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  # ---------------------------------------------------------------- monitoring (profile)
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

  # emails the alerts (monitoring/alerts.yml) - its SMTP account is in monitoring/alertmanager.yml,
  # made on the server from alertmanager.example.yml (README.md, "Alerts")
  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager:/alertmanager
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M}

  # checks the public site from outside the app's containers (job "site")
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    profiles: [monitoring]
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}

  # the server's disk, memory and CPU, plus the backup's last-success time (backups/metrics)
  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: [monitoring]
    restart: unless-stopped
    pid: host
    command: ["--path.rootfs=/host", "--collector.textfile.directory=/textfile"]
    volumes:
      - /:/host:ro,rslave
      - ./backups/metrics:/textfile:ro
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/compose/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    depends_on: [prometheus]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

volumes:
  pgdata:
  prometheus:
  grafana:
  alertmanager:
