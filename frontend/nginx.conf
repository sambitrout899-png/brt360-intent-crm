# The web container: the built UI, and /api passed on to the API container.
# Same routes as the host nginx site deploy/brt360.sh writes.
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    root /usr/share/nginx/html;

    # Docker's DNS, asked again every 10 s: a deploy recreates the API container with a
    # new address, and an address nginx looked up once at start answers 502 from then on
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    # the training service's container (backend/app/services/training.py, PREFIXES)
    set $training http://training:8000;

    location /api/ {
        proxy_pass $api;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/training/ {
        proxy_pass $training;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/assessments/ {
        proxy_pass $training;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/p/ {
        proxy_pass $training;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /docs         { proxy_pass $api; }
    location /openapi.json { proxy_pass $api; }

    # Vite puts a content hash in every asset name - safe to cache for good
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
