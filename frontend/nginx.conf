# The web container: the built UI, and /api passed on to the API container.
# Same routes as the host nginx site deploy/brt360.sh writes.
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    root /usr/share/nginx/html;

    # Docker's DNS, asked again every 10 s: a deploy recreates the API container with a
    # new address, and an address nginx looked up once at start answers 502 from then on
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # keeps the client IP the host nginx put in front (rate limits are per client)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
    location /docs         { proxy_pass $api; }
    location /openapi.json { proxy_pass $api; }

    # Vite puts a content hash in every asset name - safe to cache for good
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
