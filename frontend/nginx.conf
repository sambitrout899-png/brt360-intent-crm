# The web container: the built UI, and /api passed on to the API container.
# Same routes as the host nginx site deploy/brt360.sh writes.
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    root /usr/share/nginx/html;

    # Docker's DNS, asked again every 10 s: a deploy recreates the API container with a
    # new address, and an address nginx looked up once at start answers 502 from then on
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    # the split services' containers: each location below is one of their PREFIXES
    # (backend/app/services/<name>.py; tests/test_services_split.py checks they match)
    set $training http://training:8000;
    set $bim http://bim:8000;
    set $product http://product:8000;
    set $metadata http://metadata:8000;
    set $intent http://intent:8000;
    set $flow http://flow:8000;
    set $notification http://notification:8000;

    location /api/ {
        proxy_pass $api;
        include /etc/nginx/brt360_proxy.conf;
    }

    # training
    location /api/training/ {
        proxy_pass $training;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/assessments/ {
        proxy_pass $training;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/p/ {
        proxy_pass $training;
        include /etc/nginx/brt360_proxy.conf;
    }

    # bim
    location /api/bim/ {
        proxy_pass $bim;
        include /etc/nginx/brt360_proxy.conf;
    }

    # product
    location /api/catalog {
        proxy_pass $product;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/configurator/ {
        proxy_pass $product;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/audit {
        proxy_pass $product;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/product-model {
        proxy_pass $product;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/product-config {
        proxy_pass $product;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/product-classes {
        proxy_pass $product;
        include /etc/nginx/brt360_proxy.conf;
    }

    # metadata
    location /api/pages/ {
        proxy_pass $metadata;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/pages {
        proxy_pass $metadata;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/custom-records/ {
        proxy_pass $metadata;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/record-types {
        proxy_pass $metadata;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/records/ {
        proxy_pass $metadata;
        include /etc/nginx/brt360_proxy.conf;
    }
    # intent
    location /api/intents {
        proxy_pass $intent;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/agent/ {
        proxy_pass $intent;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/assistant/ {
        proxy_pass $intent;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/intents {
        proxy_pass $intent;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/conflicts {
        proxy_pass $intent;
        include /etc/nginx/brt360_proxy.conf;
    }

    # flow
    location /api/admin/flows {
        proxy_pass $flow;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/flow-runs {
        proxy_pass $flow;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/flow-approvals {
        proxy_pass $flow;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/process-builder/ {
        proxy_pass $flow;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/function-map {
        proxy_pass $flow;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/change {
        proxy_pass $flow;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/approvals {
        proxy_pass $flow;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/approval-policy {
        proxy_pass $flow;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/approval-rules {
        proxy_pass $flow;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/approvals {
        proxy_pass $flow;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/price-lists {
        proxy_pass $flow;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/process-roles {
        proxy_pass $flow;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/quote-document-templates {
        proxy_pass $flow;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/state-models {
        proxy_pass $flow;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/positions {
        proxy_pass $flow;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/assignment-rules {
        proxy_pass $flow;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/custom-fields {
        proxy_pass $flow;
        include /etc/nginx/brt360_proxy.conf;
    }

    # notification
    location /api/notices {
        proxy_pass $notification;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/broadcasts {
        proxy_pass $notification;
        include /etc/nginx/brt360_proxy.conf;
    }
    location /api/admin/notification-deliveries {
        proxy_pass $notification;
        include /etc/nginx/brt360_proxy.conf;
    }

    location /docs         { proxy_pass $api; }
    location /openapi.json { proxy_pass $api; }

    # Vite puts a content hash in every asset name - safe to cache for good
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
